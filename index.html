<!DOCTYPE html>

<html>
<head>
    <title>BEEP!</title>
    
    <link type="stylesheet" href="index.css">
</head>
<body>
    <form action="http://192.168.1.6:3000/">
        <input type="range" min="20" max="2000" step="5" value="440"  name="waveLength">
        <input type="number" min="0.1" max="30" value="1" name="playDuration">
        <select name="waveType">
            <option value="sine">sine</option>
            <option value="triangle">triangle</option>
            <option value="square">square</option>
            <option value="sawtooth">sawtooth</option>
        </select>
        <button onclick="submit">submit</button>
    </form>
</body>
</html>
